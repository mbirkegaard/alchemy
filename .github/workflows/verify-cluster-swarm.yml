name: Verify pinned Effect Cluster drafts on Docker Swarm

on:
  push:
    branches: [test/verify-cluster-swarm-d2ca3de]

permissions:
  contents: read

jobs:
  swarm:
    name: Swarm (${{ matrix.pr }})
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '#3678'
            sha: d2ca3de15e2c6cb8406a8d6f3166d48314e9bcce
          - pr: '#3736'
            sha: c98c059e2982312ae5a062b8926468adec7a5db3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Verify checkout and Docker
        env:
          TEST_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          git log -1 --oneline
          docker version
          docker info --format 'Swarm at start: {{.Swarm.LocalNodeState}}'

      - name: Checkout distilled
        run: git submodule update --init --depth=1 --checkout -- submodules/distilled

      - name: Set up pnpm, Node.js and Bun
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true
          require-lockfile: true

      - name: Check runner-local Swarm ingress
        run: |
          ip -4 route
          node_ip=$(ip -4 route get 1.1.1.1 | awk '{for (i=1;i<NF;i++) if ($i=="src") {print $(i+1); exit}}')
          test -n "$node_ip"
          docker swarm init --advertise-addr "$node_ip" --default-addr-pool 172.30.0.0/16 --default-addr-pool-mask-length 24
          trap 'docker service rm ci-ingress-check' EXIT
          docker service create --name ci-ingress-check --publish 18080:8080 busybox:1.37 sh -c 'mkdir /www && echo ready >/www/index.html && httpd -f -p 8080 -h /www'
          docker service ps --no-trunc ci-ingress-check
          task=$(docker ps -q --filter label=com.docker.swarm.service.name=ci-ingress-check)
          docker exec "$task" wget -qO- http://127.0.0.1:8080/
          result=0
          for address in 127.0.0.1 "$node_ip" localhost; do
            echo "Checking ingress via $address"
            curl --noproxy '*' --fail --retry 2 --retry-all-errors --retry-delay 2 --max-time 3 "http://$address:18080/" || result=1
          done
          exit "$result"

      - name: Run Docker and Domain separately and capture failed stack diagnostics
        run: |
          result=0
          for suite in Docker Domain; do
            echo "::group::$suite suite"
            if timeout --kill-after=15s 12m pnpm test:integration "test/Cluster/$suite.test.ts" --retry 0 --concurrency 1; then
              echo "$suite passed"
            else
              result=1
              docker service ls || true
              docker ps -a || true
              for service in $(docker service ls -q); do
                docker service ps --no-trunc "$service" || true
                timeout 10s docker service logs --tail 30 "$service" || true
              done
            fi
            echo '::endgroup::'
          done
          exit "$result"

      - name: Leave runner-local Swarm
        if: always()
        run: |
          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ]; then
            docker swarm leave --force
          fi
